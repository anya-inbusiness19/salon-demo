<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salon Site Demo</title>
<meta name="description" content="Healthy, glossy, finished hair from stylists who listen first. Pick your service, choose a time that works for you, and hold your chair online in under a minute.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500&family=Inter:wght@400;500;600&display=swap">
<style id="css">
html,body{margin:0;padding:0}img{max-width:100%}
/* Layout: Lovi-style porcelain canvas, 1200px column, white 40px-radius section containers, max 3-col grids, neutral pill actions. One committed light look. */
:root{
  color-scheme: light;
  --canvas:#f6f6fa; --card:#ffffff; --warm:#f6f5f4;
  --ink:#151581; --graphite:#292824; --mist:#a1a1cd; --ash:#949392; --pebble:#bfbfbd; --fog:#e4e4ee;
  --green:#00bb76; --rose:#f25c75;
  --grad:linear-gradient(270deg,rgba(102,127,255,.8) 19.6%,rgba(206,162,255,.8) 50%,rgba(255,133,177,.8) 86%);
  --shadow:rgba(36,36,41,.07) 0 8px 34px 0, rgba(37,36,41,.09) 0 1px 2px 0;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --gx:max(16px,env(safe-area-inset-left,0px)); --gy:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--canvas);color:var(--graphite);font:400 16px/1.45 var(--body);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--canvas)}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--gx);padding-right:var(--gy)}
h1,h2,h3{font-family:var(--display);font-weight:400;color:var(--ink);margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
.ph{color:var(--ink);border-bottom:1.5px dashed var(--mist);padding-bottom:1px}
.eyebrow{font:500 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}

/* demo strip */
.strip{background:var(--ink);color:#e9e9fb;font-size:13px}
.strip .wrap{display:flex;gap:8px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:9px}
.strip b{font-weight:600;color:#fff}
.strip span:last-child{color:var(--mist)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(246,246,250,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.scrolled{border-color:var(--fog)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font:500 20px/1 var(--display);color:var(--ink);letter-spacing:-.03em}
.logo i{width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--mist);display:grid;place-items:center;font:500 10px var(--body);color:var(--mist);font-style:normal;letter-spacing:0}
.links{display:flex;gap:28px;font-size:15px}
.links a{text-decoration:none;color:var(--graphite);transition:color .2s}
.links a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:48px;padding:13px 22px;font-weight:500;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .25s,color .25s,border-color .25s;white-space:nowrap}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover{box-shadow:0 10px 28px rgba(21,21,129,.25);transform:translateY(-1px)}
.btn-ghost{background:transparent;border-color:var(--fog);color:var(--ink)}
.btn-ghost:hover{background:var(--card);box-shadow:var(--shadow)}
.btn-sm{padding:10px 18px;font-size:14px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

/* hero */
.hero{padding-block:56px 40px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(46px,7.4vw,96px);line-height:.92;letter-spacing:-.045em}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lede{font-size:18px;line-height:1.5;color:var(--graphite);max-width:30em;margin-top:24px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.trust{display:flex;align-items:center;gap:10px;margin-top:32px;font-size:14px;color:var(--ash)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(0,187,118,.15);animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(0,187,118,.05)}}
.hero-media{position:relative;border-radius:40px;overflow:hidden;aspect-ratio:4/4.6;max-width:100%;background:var(--warm);box-shadow:var(--shadow)}
.hero-media img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.06);animation:settle 1.6s var(--ease) forwards}
@keyframes settle{to{transform:scale(1)}}
.float{position:absolute;left:20px;bottom:20px;right:20px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:24px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow)}
.float small{display:block;color:var(--ash);font-size:12px}
.float strong{font:500 18px/1.2 var(--display);color:var(--ink);letter-spacing:-.02em}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slots span{font-size:12px;font-weight:500;padding:6px 10px;border-radius:12px;background:var(--canvas);color:var(--ink)}

/* load sequence (starts from visible state) */
.in{animation:rise .9s var(--ease) both}
.in.d1{animation-delay:.08s}.in.d2{animation-delay:.16s}.in.d3{animation-delay:.24s}.in.d4{animation-delay:.32s}
@keyframes rise{from{transform:translateY(14px);opacity:.25}to{transform:none;opacity:1}}

/* scroll-fade statement (Lovi) */
.statement{padding-block:72px}
.statement p{font:400 clamp(28px,4.2vw,48px)/1.08 var(--display);letter-spacing:-.035em;max-width:22em;text-wrap:balance}
.statement .w{color:var(--ink);transition:color .5s var(--ease)}
.js .statement .w{color:var(--mist)}
.js .statement .w.on{color:var(--ink)}

/* sections */
section{scroll-margin-top:80px}
.block{background:var(--card);border-radius:40px;padding:56px;box-shadow:var(--shadow)}
.sec{padding-block:40px}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px 32px;flex-wrap:wrap;margin-bottom:32px}
.head h2{font-size:clamp(34px,4.6vw,48px);line-height:.95;letter-spacing:-.04em;margin-top:10px}
.head p{color:var(--ash);max-width:26em;font-size:15px}

/* services */
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:5px;background:var(--canvas);border-radius:48px;width:max-content;max-width:100%;margin-bottom:24px}
.tab{border:0;background:transparent;padding:10px 18px;border-radius:48px;cursor:pointer;color:var(--ash);font-weight:500;font-size:14px;transition:background .3s var(--ease),color .3s,box-shadow .3s}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:20px 0;border-bottom:1px solid var(--fog);align-items:baseline}
.item h3{font:500 20px/1.2 var(--display);letter-spacing:-.02em}
.item .price{font:400 22px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.item p{grid-column:1/-1;color:var(--ash);font-size:14px}
.item .book-it{grid-column:1/-1;justify-self:start;border:0;background:none;padding:0;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;opacity:.6;transition:opacity .2s}
.item:hover .book-it,.item .book-it:focus-visible{opacity:1}
.menu.swap{animation:swap .5s var(--ease)}
@keyframes swap{from{opacity:.3;transform:translateY(6px)}}
.note{margin-top:20px;font-size:13px;color:var(--ash)}

/* booking */
.booking{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:40px;align-items:stretch}
.booking>*,.visit>*,.space>*,.hero .wrap>*{min-width:0}
.bk-media{border-radius:24px;overflow:hidden;min-height:340px;position:relative;background:var(--warm)}
.bk-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:35% 50%}
.bk-media .tag{position:absolute;left:16px;top:16px;background:rgba(255,255,255,.9);border-radius:12px;padding:6px 10px;font-size:12px;font-weight:500;color:var(--ink)}
.steps{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.steps li{list-style:none;font-size:13px;font-weight:500;color:var(--pebble);display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:48px;background:var(--canvas);transition:color .3s,background .3s}
.steps li b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-size:11px}
.steps li.cur{color:var(--ink);background:#ececf8}
.steps li.done{color:var(--green)}
.steps{padding:0;margin-top:0}
.pane{animation:rise .6s var(--ease) both}
.pane h3{font-size:28px;letter-spacing:-.03em;line-height:1.1;margin-bottom:16px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--fog);background:var(--card);border-radius:16px;padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;transition:border-color .25s,box-shadow .35s var(--ease),transform .35s var(--ease);color:var(--graphite);min-width:0}
.opt:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt span{min-width:0}
.opt small{display:block;color:var(--ash);font-size:12px;margin-top:2px}
.opt strong{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
.day{flex:0 0 auto;width:62px;border:1px solid var(--fog);background:var(--card);border-radius:16px;padding:10px 0;text-align:center;cursor:pointer;transition:all .3s var(--ease);color:var(--graphite)}
.day small{display:block;font-size:11px;color:var(--ash);text-transform:uppercase;letter-spacing:.06em}
.day strong{font:400 22px/1.2 var(--display);color:var(--ink)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] strong{color:#fff}
.day:disabled{opacity:.4;cursor:not-allowed}
.times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.time{border:1px solid var(--fog);background:var(--card);border-radius:12px;padding:10px 0;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;transition:all .25s var(--ease)}
.time:hover:not(:disabled){box-shadow:var(--shadow)}
.time[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.time:disabled{color:var(--pebble);text-decoration:line-through;cursor:not-allowed;background:var(--canvas);border-color:transparent}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:24px;flex-wrap:wrap}
.summary{background:var(--canvas);border-radius:24px;padding:20px;display:grid;gap:10px;font-size:15px}
.summary div{display:flex;justify-content:space-between;gap:16px}
.summary span:first-child{color:var(--ash)}
.summary span:last-child{color:var(--ink);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.summary .due{border-top:1px solid var(--fog);padding-top:12px;margin-top:2px}
.summary .due span{font-size:17px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.field label{display:block;font-size:12px;color:var(--ash);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--fog);background:var(--card);border-radius:14px;padding:12px 14px;color:var(--graphite);transition:border-color .2s,box-shadow .2s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(21,21,129,.08)}
.pay{margin-top:16px;border-radius:16px;padding:14px 16px;background:#f2fbf7;color:#0a6b47;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.done-card{text-align:left}
.check{width:56px;height:56px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin-bottom:20px;animation:pop .7s var(--ease)}
@keyframes pop{from{transform:scale(.6)}}
.check svg{width:26px;height:26px}

/* space */
.space{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.space figure{margin:0;border-radius:40px;overflow:hidden;position:relative;background:var(--warm);min-height:280px}
.space img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease)}
.space figure:hover img{transform:scale(1.03)}
.space figcaption{position:absolute;left:16px;bottom:16px;background:rgba(255,255,255,.9);border-radius:12px;padding:6px 10px;font-size:12px;font-weight:500;color:var(--ink)}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.feat{background:var(--card);border-radius:24px;padding:24px;transition:box-shadow .4s var(--ease),transform .4s var(--ease)}
.feat:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.feat h3{font:500 20px/1.2 var(--display);letter-spacing:-.02em;margin:14px 0 6px}
.feat p{font-size:14px;color:var(--ash)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--canvas);display:grid;place-items:center;color:var(--ink)}
.ico svg{width:20px;height:20px}

/* visit */
.visit{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.info{display:grid;gap:0}
.info div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--fog);font-size:15px}
.info dt{color:var(--ash)}
.info dd{margin:0}
.hours{display:grid;gap:4px;font-variant-numeric:tabular-nums}
.hours span{display:flex;justify-content:space-between;gap:12px}
.map{position:relative;border-radius:24px;overflow:hidden;min-height:220px;margin-top:20px;background:
  linear-gradient(90deg,transparent 47%,#fff 47%,#fff 53%,transparent 53%) 0 0/100% 100%,
  linear-gradient(0deg,transparent 60%,#fff 60%,#fff 64%,transparent 64%) 0 0/100% 100%,
  linear-gradient(28deg,transparent 30%,#fff 30%,#fff 33%,transparent 33%) 0 0/100% 100%,
  repeating-linear-gradient(0deg,#ecebf6 0 1px,transparent 1px 28px),
  repeating-linear-gradient(90deg,#ecebf6 0 1px,transparent 1px 28px),#f1f1f8}
.pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);animation:drop 1s var(--ease) both}
@keyframes drop{from{transform:translate(-50%,-160%)}}
.pin span{display:block;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--ink);box-shadow:0 8px 20px rgba(21,21,129,.3)}
.pin span::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.map p{position:absolute;left:16px;bottom:16px;right:16px;background:rgba(255,255,255,.92);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--ash)}
form .field{margin-bottom:10px}
form textarea{min-height:110px;resize:vertical}
.sent{margin-top:12px;font-size:14px;color:#0a6b47}

/* footer */
footer{padding-block:56px 120px}
footer .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:end;border-top:1px solid var(--fog);padding-top:32px}
.credit{font-size:14px;color:var(--ash)}
.credit strong{color:var(--ink);font-weight:600}
.credit a{color:var(--ink)}

/* chat (fixed bottom-right, like Lovi's seal) */
.chat-btn{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:10px;border:0;cursor:pointer;border-radius:9999px;padding:8px 18px 8px 8px;background:var(--card);box-shadow:var(--shadow);color:var(--ink);font-weight:500;font-size:14px;transition:transform .4s var(--ease),box-shadow .4s}
.chat-btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(36,36,41,.12)}
.chat-btn i{width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center}
.chat-btn svg{width:18px;height:18px}
.chat{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;width:min(360px,calc(100vw - 32px));background:var(--card);border-radius:24px;box-shadow:0 20px 60px rgba(36,36,41,.18);overflow:hidden;display:flex;flex-direction:column;max-height:min(520px,calc(100vh - 140px));transform-origin:bottom right;animation:open .45s var(--ease)}
@keyframes open{from{transform:scale(.92) translateY(10px);opacity:0}}
.chat header{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--fog)}
.chat header strong{display:block;color:var(--ink);font-weight:600;font-size:15px}
.chat header small{display:flex;align-items:center;gap:6px;color:var(--ash);font-size:12px}
.chat header small .dot{width:6px;height:6px;box-shadow:none;animation:none}
.x{border:0;background:var(--canvas);width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--ink);font-size:18px;line-height:1}
.msgs{padding:16px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.4;animation:rise .4s var(--ease) both}
.msg.them{background:var(--canvas);color:var(--graphite);border-bottom-left-radius:6px}
.msg.me{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mist);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.3}}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.quick button{border:1px solid var(--fog);background:var(--card);border-radius:48px;padding:7px 12px;font-size:12px;color:var(--ink);cursor:pointer;transition:background .2s}
.quick button:hover{background:var(--canvas)}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--fog)}
.compose input{flex:1;min-width:0;border:1px solid var(--fog);border-radius:48px;padding:10px 14px}
.compose button{border:0;border-radius:50%;width:40px;height:40px;background:var(--ink);color:#fff;cursor:pointer;flex:0 0 auto}

@media (max-width:900px){
  .hero .wrap,.booking,.visit,.space{grid-template-columns:minmax(0,1fr)}
  .hero-media{aspect-ratio:4/4}
  .menu{grid-template-columns:1fr}
  .feats{grid-template-columns:1fr}
  .block{padding:32px 24px;border-radius:32px}
  .links{display:none}
  .bk-media{min-height:240px}
}
@media (max-width:520px){
  .hero{padding-block:32px 24px}
  .opts{grid-template-columns:1fr}
  .times{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fields{grid-template-columns:1fr}
  .block{padding:24px 16px}
  .chat-btn span{display:none}
  .chat-btn{padding:8px}
  .info div{grid-template-columns:1fr;gap:4px}
  .float{flex-direction:column;align-items:flex-start}
  .nav .btn{padding:9px 14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .js .statement .w{color:var(--ink)}
}

/* ===== owner tools ===== */
.logo img{width:30px;height:30px;border-radius:50%;object-fit:cover;display:block}
.edit-pill{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--fog);background:var(--card);color:var(--ink);border-radius:48px;padding:10px 16px;font-weight:500;font-size:14px;text-decoration:none;box-shadow:var(--shadow);transition:transform .35s var(--ease)}
.edit-pill:hover{transform:translateY(-2px)}
.edit-pill svg{width:16px;height:16px}

  .wday{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

  .edit-pill span{display:none}
}

const SAVED_KEY='salon-saved-site',FILE_SIG=JSON.stringify(FILE_DATA);

try{const s=JSON.parse(localStorage.getItem(SAVED_KEY)||'null');if(s&&s.base===FILE_SIG)DATA=s.data;else localStorage.removeItem(SAVED_KEY)}catch(e){}

try{const s=localStorage.getItem(DRAFT_KEY);if(s){const d=JSON.parse(s);if(d&&d.base===JSON.stringify(DATA))draft=d.draft}}catch(e){}

/* local stand-ins: bookings, messages and photos are kept in this browser */
const LS={get(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const listeners={};
function localCollection(name){const key='salon-'+name;return{
  orderBy(){return this},limit(){return this},
  async add(d){const rows=LS.get(key);const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);rows.unshift({id,...d});if(!LS.set(key,rows))throw new Error('full');emit(name);return{id}},
  onSnapshot(fn){(listeners[name]=listeners[name]||[]).push(fn);fn(snap(name))}}}

  const order=[1,2,3,4,5,6,0],key=i=>sch[i].open?`${sch[i].start}-${sch[i].end}`:'x',out=[];

  return out.map(g=>{const s=sch[g.from];const lbl=g.from===g.to?DAY[g.from]:`${DAY[g.from].slice(0,3)} – ${DAY[g.to].slice(0,3)}`;
    return [lbl,s.open?`${fmtT(s.start,0)} – ${fmtT(s.end,0)}`:'Closed']});

const app=$('#app');
app.addEventListener('click',async e=>{
  if(route()!=='site')return;
  const t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.a==='back-admin'){previewing=false;location.hash='admin';return}
  if(t.matches('.tab')){cat=t.dataset.c;renderTabs();renderMenu(true);return}
  if(t.matches('.book-it')){state.service=ALL.find(s=>s.n===t.dataset.n);state.step=1;renderBook();$('#book').scrollIntoView({behavior:'smooth'});return}
  if(t.id==='chatBtn'){toggleChat($('#chat').hidden);return}
  if(t.id==='chatX'){toggleChat(false);return}
  if(t.dataset.q!=null){const f=D.faq[+t.dataset.q];addMsg(f.q,'me');reply(f.a);t.remove();return}
  if(!t.closest('#pane'))return;
  if(t.matches('.opt')){state.service=ALL[+t.dataset.i];renderBook();return}
  if(t.matches('.day')){state.date=days[+t.dataset.d];state.time=null;renderBook();return}
  if(t.matches('.time')){state.time=slotsFor(state.date)[+t.dataset.t];renderBook();return}
  if(t.id==='back'){state.step--;renderBook();return}
  if(t.id==='restart'){Object.assign(state,{step:0,service:null,date:null,time:null,saved:null});renderBook();return}
  if(t.id==='next'){
    if(state.step===2){const n=$('#b-name'),p=$('#b-phone');state.name=n.value.trim();state.phone=p.value.trim();
      if(!state.name){n.focus();n.style.borderColor='var(--rose)';return}
      if(state.phone.replace(/\D/g,'').length<10){p.focus();p.style.borderColor='var(--rose)';return}
      state.saving=true;renderBook();state.saved=previewing?false:await saveBooking();state.saving=false}
    state.step++;renderBook();
  }
});

  <div class="a-card"><h2>Brand color</h2><p class="sub">Used for headings, buttons and prices.</p>
    <div class="color-row" style="margin-top:16px"><input type="color" id="f-brand-color" data-k="brand.color" value="${esc(draft.brand.color)}" aria-label="Brand color">
    <div class="swatches">${sw.map(c=>`<button data-a="color" data-c="${c}" style="background:${c}" aria-label="Use ${c}"></button>`).join('')}</div></div></div>
  <div class="a-card"><h2>Top banner &amp; footer</h2><p class="sub">Turn the banner off when this becomes the salon’s real site.</p>
    <div style="margin-top:16px">${check('Show the top banner','strip.show')}</div>
    <div class="a-grid">${field('Banner left','strip.left')}${field('Banner right','strip.right')}
    ${field('Footer note','footer.note')}${field('Footer credit','footer.credit')}</div></div>
  <div class="a-card"><h2>Admin password</h2><p class="sub">Pick a new password, save, then upload the new site file to GitHub.</p>
    <div class="a-grid"><div class="field"><label for="np1">New password</label><input id="np1" type="password" autocomplete="new-password"></div>
    <div class="field"><label for="np2">Type it again</label><input id="np2" type="password" autocomplete="new-password"></div></div>
    <div class="add-row"><button class="mini" data-a="set-pw">Set new password</button></div></div>`;
}
function text(){
  return `<div class="a-card"><h2>Top of the page</h2><div class="a-grid">
    ${field('Small line above the headline','hero.eyebrow',{full:true})}
    ${field('Headline','hero.headline')}${field('Word to highlight','hero.highlight',{hint:'Must match a word in the headline.'})}
    ${field('Intro paragraph','hero.lede',{area:true,full:true})}
    ${field('Green status line','hero.trust',{full:true,hint:'Leave empty to hide.'})}
    ${field('Big statement under the photo','statement',{area:true,full:true,hint:'Leave empty to hide.'})}</div></div>
  <div class="a-card"><h2>Section text</h2><div class="a-grid">
    ${field('Services intro','servicesIntro',{area:true,full:true})}
    ${field('Note under the menu','menuNote',{full:true,hint:'Leave empty to hide.'})}
    ${field('Booking photo label','booking.tag')}
    ${field('“The space” heading','space.title')}
    ${field('“The space” text','space.text',{area:true,full:true})}
    ${field('Photo 1 label','space.cap1')}${field('Photo 2 label','space.cap2')}</div></div>`;
}
function services(){
  return `<div class="a-card"><h2>Services &amp; prices</h2><p class="sub">Each group is a tab on the menu. Booking uses the same list.</p>
  ${draft.menu.map((c,ci)=>`<div class="cat"><div class="cat-head">${field('Group name','menu.'+ci+'.cat')}<button class="mini danger" data-a="del-cat" data-ci="${ci}">Remove group</button></div>
    ${c.items.map((it,ii)=>{const b=`menu.${ci}.items.${ii}`;return `<div class="svc">
      <div class="name">${field('Service','b.n'.replace('b',b))}</div>${field('Price $',b+'.p',{num:1})}${field('Minutes',b+'.d',{num:1})}
      <button class="mini danger del" data-a="del-item" data-ci="${ci}" data-ii="${ii}" aria-label="Remove ${esc(it.n)}">Remove</button>
      <div class="desc">${field('Description',b+'.desc')}</div><div class="plus">${check('Price is “starting at”',b+'.plus')}</div></div>`}).join('')}
    <div class="add-row"><button class="mini" data-a="add-item" data-ci="${ci}">+ Add service</button></div></div>`).join('')}
  <div class="add-row"><button class="btn btn-ghost btn-sm" data-a="add-cat">+ Add a group</button></div></div>`;
}
function hours(){
  return `<div class="a-card"><h2>Opening hours</h2><p class="sub">Sets the hours in the Visit section and the times clients can book. The last booking starts an hour before close.</p>
  <div class="week">${[1,2,3,4,5,6,0].map(i=>{const s=draft.schedule[i];return `<div class="wday">${check(DAY[i],'schedule.'+i+'.open')}
    <select id="f-sch-${i}-s" data-k="schedule.${i}.start" data-num="1" aria-label="${DAY[i]} opens" ${s.open?'':'disabled'}>${hourOpts(s.start)}</select>
    <select id="f-sch-${i}-e" data-k="schedule.${i}.end" data-num="1" aria-label="${DAY[i]} closes" ${s.open?'':'disabled'}>${hourOpts(s.end)}</select></div>`}).join('')}</div></div>
  <div class="a-card"><h2>Booking deposit</h2><p class="sub">Set to 0 to let clients book without paying anything up front.</p>
    <div class="a-grid">${field('Deposit amount ($)','booking.deposit',{num:1})}</div></div>`;
}
const PHOTOS=[['logo','Logo','Small round mark beside the salon name'],['hero','Main photo','Big photo at the top'],['booking','Booking photo','Next to the booking steps'],['space1','Space photo 1','Large photo in The space'],['space2','Space photo 2','Small photo in The space']];
function photos(){
  return `<div class="a-card"><h2>Photos &amp; logo</h2><p class="sub">Upload JPG or PNG files from the salon. Square photos work best for the logo.</p>
  
  <div class="photos">${PHOTOS.map(([k,l,h])=>`<div class="photo"><div class="pv">${draft.photos[k]?`<img src="${esc(draft.photos[k])}" alt="${esc(l)}">`:'No image yet'}</div>
    <div class="pb"><span><b>${l}</b><br><small style="color:var(--ash)">${h}</small></span><span style="display:flex;gap:6px">
    ${cap.assets?`<label class="mini" for="up-${k}">Upload</label><input type="file" id="up-${k}" accept="image/*" data-up="${k}">`:''}
    ${draft.photos[k]!==(k==='logo'?'':DEFAULT_PHOTOS[k])?`<button class="mini" data-a="reset-photo" data-k="${k}">Reset</button>`:''}</span></div></div>`).join('')}</div></div>`;
}
const DEFAULT_PHOTOS={hero:'hair.jpg',booking:'stylist.jpg',space1:'salon.jpg',space2:'stylist.jpg'};
function faq(){
  return `<div class="a-card"><h2>Chat answers</h2><p class="sub">Quick questions shown in the chat bubble, with the answer the client sees.</p>
  ${draft.faq.map((f,i)=>`<div class="faq">${field('Question','faq.'+i+'.q')}${field('Answer','faq.'+i+'.a',{area:true})}
    <div><button class="mini danger" data-a="del-faq" data-i="${i}">Remove</button></div></div>`).join('')}
  <div class="add-row"><button class="mini" data-a="add-faq">+ Add a question</button></div></div>`;
}
const SECTIONS={dashboard,business,text,services,hours,photos,faq};

function renderAdmin(){
  document.documentElement.style.setProperty('--ink',draft.brand.color||'#151581');
  if(!cap.ready){app.innerHTML=`<div class="wrap"><div class="a-card locked"><h2>Checking access…</h2></div></div>`;return}
  if(!cap.canEdit){app.innerHTML=`<div class="wrap"><form class="a-card locked" id="login"><h2>Admin login</h2><p class="sub">Enter the admin password to edit this site.</p>
    <div class="field" style="margin-top:18px"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="hint" id="pwErr" hidden style="color:var(--rose)">That password isn’t right. Check it and try again.</p>
    <div class="row"><a class="btn btn-ghost btn-sm" href="#top">Back to the site</a><button class="btn btn-ink btn-sm" type="submit">Log in</button></div></form></div>`;
    setTimeout(()=>{const p=$('#pw');if(p)p.focus()},50);return}
  subscribe();
  const unread=messages.filter(m=>!m.read).length,nb=bookings.filter(b=>b.status==='new').length;
  app.innerHTML=`<div class="admin"><div class="a-top"><div class="wrap"><div><h1>${esc(draft.brand.name||'Your Salon')} · Admin</h1><small>Edit, save, then upload the site file to GitHub to make it public.</small></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" data-a="download">Download site file</button><a class="btn btn-ghost btn-sm" href="#top">View site</a><button class="btn btn-ghost btn-sm" data-a="logout">Log out</button></div></div></div>
  <div class="wrap a-shell"><nav class="a-nav" aria-label="Admin sections">${TABS.map(([k,l])=>`<button data-a="tab" data-t="${k}" aria-current="${atab===k}">${l}${k==='dashboard'&&(unread+nb)?`<span class="count">${unread+nb}</span>`:''}</button>`).join('')}</nav>
  <div class="a-main" id="amain">${SECTIONS[atab]()}</div></div></div>
  <div class="savebar" id="savebar"><div class="wrap"><span id="saveTxt">You have unsaved changes.</span><div class="b">
    <button data-a="discard">Discard</button><button data-a="preview">Preview</button><button class="pub" data-a="publish" id="pubBtn">Save changes</button></div></div></div>`;
  updateSavebar();
}
const dirty=()=>JSON.stringify(draft)!==JSON.stringify(DATA);
function updateSavebar(){const b=$('#savebar');if(b)b.classList.toggle('on',dirty());
  try{dirty()?localStorage.setItem(DRAFT_KEY,JSON.stringify({base:JSON.stringify(DATA),draft})):localStorage.removeItem(DRAFT_KEY)}catch(e){}}
function rerenderSection(){const m=$('#amain');if(m)m.innerHTML=SECTIONS[atab]();updateSavebar()}
function toast(t){const o=document.querySelector('.toast');if(o)o.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}

function subscribe(){
  if(subbed||!cap.db)return;subbed=true;
  const fail=e=>{dbErr=e&&e.code==='not_granted'?'Allow this page to use its data to see bookings and messages.':'Couldn’t load bookings right now. Reload the page to try again.';if(route()==='admin'&&atab==='dashboard')rerenderSection()};
  cap.db.collection('bookings').orderBy('created','desc').limit(200).onSnapshot(s=>{bookings=s.docs.map(d=>({id:d.id,...d.data()}));dbErr='';if(route()==='admin')refreshAdminLive()},fail);
  cap.db.collection('messages').orderBy('created','desc').limit(200).onSnapshot(s=>{messages=s.docs.map(d=>({id:d.id,...d.data()}));dbErr='';if(route()==='admin')refreshAdminLive()},fail);
}
function refreshAdminLive(){
  const n=document.querySelector('.a-nav button[data-t="dashboard"]');
  if(n){const c=messages.filter(m=>!m.read).length+bookings.filter(b=>b.status==='new').length;n.innerHTML=`Bookings &amp; messages${c?`<span class="count">${c}</span>`:''}`}
  if(atab==='dashboard'){const m=$('#amain');if(m)m.innerHTML=dashboard()}
}

app.addEventListener('input',e=>{
  if(route()!=='admin')return;const el=e.target,k=el.dataset.k;if(!k)return;
  let v=el.type==='checkbox'?el.checked:el.dataset.num?Math.max(0,Math.round(+el.value||0)):el.value;
  setP(draft,k,v);
  if(k==='brand.color')document.documentElement.style.setProperty('--ink',v);
  if(k.startsWith('schedule.')&&k.endsWith('.open'))rerenderSection();
  else if(/^schedule\.\d\.(start|end)$/.test(k)){const i=k.split('.')[1],s=draft.schedule[i];if(s.end<=s.start){s.end=Math.min(22,s.start+1);rerenderSection();return}}
  updateSavebar();
});
app.addEventListener('submit',async e=>{
  if(e.target.id!=='login')return;e.preventDefault();
  const pw=$('#pw').value;const ok=(await sha(DATA.admin.salt+pw))===DATA.admin.hash;
  if(!ok){$('#pwErr').hidden=false;$('#pw').select();return}
  try{sessionStorage.setItem(SESSION_KEY,'1')}catch(e){}cap.canEdit=true;renderAdmin();
});
app.addEventListener('change',async e=>{
  const el=e.target;if(route()!=='admin'||!el.dataset.up||!el.files[0])return;
  const k=el.dataset.up,f=el.files[0];
  if(!f.type.startsWith('image/')){toast('Pick a JPG, PNG or WebP image.');return}
  toast('Uploading…');
  try{const r=await cap.assets.upload(f);draft.photos[k]=r.url;rerenderSection();toast('Photo added. Save to put it on the site.')}
  catch(err){toast(err&&err.code==='too_large'?'That photo is too big. Try one under 20 MB.':'Upload didn’t go through. Try again.')}
});
app.addEventListener('click',async e=>{
  if(route()!=='admin')return;const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  if(a==='tab'){atab=t.dataset.t;renderAdmin();scrollTo({top:0});return}
  if(a==='color'){draft.brand.color=t.dataset.c;$('#f-brand-color').value=t.dataset.c;document.documentElement.style.setProperty('--ink',t.dataset.c);updateSavebar();return}
  if(a==='add-cat'){draft.menu.push({cat:'New group',items:[{n:'New service',p:0,d:30,desc:'',plus:false}]});rerenderSection();return}
  if(a==='del-cat'){draft.menu.splice(+t.dataset.ci,1);rerenderSection();return}
  if(a==='add-item'){draft.menu[+t.dataset.ci].items.push({n:'New service',p:0,d:30,desc:'',plus:false});rerenderSection();return}
  if(a==='del-item'){draft.menu[+t.dataset.ci].items.splice(+t.dataset.ii,1);rerenderSection();return}
  if(a==='add-faq'){draft.faq.push({q:'',a:''});rerenderSection();return}
  if(a==='del-faq'){draft.faq.splice(+t.dataset.i,1);rerenderSection();return}
  if(a==='reset-photo'){const k=t.dataset.k;draft.photos[k]=k==='logo'?'':DEFAULT_PHOTOS[k];rerenderSection();return}
  if(a==='discard'){draft=clone(DATA);renderAdmin();toast('Changes discarded.');return}
  if(a==='preview'){previewing=true;location.hash='top';return}
  if(a==='publish'){publish();return}
  if(a==='download'){downloadSite();return}
  if(a==='logout'){try{sessionStorage.removeItem(SESSION_KEY)}catch(e){}cap.canEdit=false;location.hash='top';return}
  if(a==='set-pw'){const a1=$('#np1').value,a2=$('#np2').value;
    if(a1.length<8){toast('Use at least 8 characters.');return}
    if(a1!==a2){toast('The two passwords don’t match.');return}
    const salt=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('');
    draft.admin={salt,hash:await sha(salt+a1)};$('#np1').value='';$('#np2').value='';updateSavebar();toast('New password set. Save, then upload the site file to GitHub.');return}
  if(a==='bk'){try{await cap.db.doc('bookings/'+t.dataset.id).update({status:t.dataset.s})}catch(err){toast('Couldn’t update that booking. Try again.')}return}
  if(a==='msg-read'){try{await cap.db.doc('messages/'+t.dataset.id).update({read:true})}catch(err){toast('Couldn’t update that message. Try again.')}return}
});

async function publish(){
  const problems=[];
  draft.menu.forEach(c=>{if(!c.cat.trim())problems.push('a service group has no name');c.items.forEach(it=>{if(!it.n.trim())problems.push('a service has no name')})});
  if(!draft.menu.some(c=>c.items.length))problems.push('add at least one service');
  if(problems.length){toast('Before saving: '+[...new Set(problems)].join(', ')+'.');return}
  draft.faq=draft.faq.filter(f=>f.q.trim()&&f.a.trim());
  DATA=clone(draft);
  try{localStorage.setItem(SAVED_KEY,JSON.stringify({base:FILE_SIG,data:DATA}));localStorage.removeItem(DRAFT_KEY)}catch(e){toast('Saved for now, but this browser is out of space. Download the site file to keep your changes.')}
  updateSavebar();downloadSite();
  toast('Saved. Upload the downloaded index.html to your GitHub repo to make it public.');
}
function downloadSite(){
  const blob=new Blob([buildDoc(DATA)],{type:'text/html'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function buildDoc(d){
  const css=document.getElementById('css').textContent,js=document.getElementById('app-js').textContent;
  const json=JSON.stringify(d,null,1).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'+
    '<title>'+esc(d.brand.name&&d.brand.name!=='Your Salon'?d.brand.name:'Salon Site Demo')+'<\/title>\n'+
    '<meta name="description" content="'+esc(d.hero.lede)+'">\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500&family=Inter:wght@400;500;600&display=swap">\n'+
    '<style id="css">'+css+'<\/style>\n<\/head>\n<body>\n<div id="app"><\/div>\n'+
    '<script type="application/json" id="site-data">'+json+'<\/script>\n'+
    '<script id="app-js">'+js+'<\/script>\n<\/body>\n<\/html>\n';
}

/* ---------- routing ---------- */
const route=()=>location.hash==='#admin'?'admin':'site';
let lastRoute=null;
function go(){
  const r=route();
  if(r==='admin'){previewing=false;renderAdmin()}
  else if(lastRoute!=='site'||r!==lastRoute){renderSite();const h=location.hash.slice(1);if(h&&h!=='top'){const el=document.getElementById(h);if(el)el.scrollIntoView()}else scrollTo({top:0})}
  lastRoute=r;
}
addEventListener('hashchange',go);
go();

cap.db=localDb;cap.assets=localAssets;
try{cap.canEdit=sessionStorage.getItem(SESSION_KEY)==='1'}catch(e){}
cap.ready=true;
if(route()==='admin')renderAdmin();else if(cap.canEdit){const s=scrollY;renderSite();scrollTo({top:s})}
</script>
</body>
</html>
